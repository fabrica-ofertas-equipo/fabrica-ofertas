# Banco de «formas» del barrido por forma (D1 Modo D, spec departamentos/02-descubrimiento.md §17.3 pieza 1).
# Una «forma» es una frase ESTRUCTURAL de las ofertas digitales de pago único («acceso inmediato en PDF»,
# «+100 plantillas», «garantía de 7 días»…): trae anuncios de TODOS los temas, no de un nicho elegido de antemano.
#
# Reglas del archivo (las verifica plan.cargar_banco; si algo falla, el plan no se genera):
#  - `idiomas.<idioma>.paises`: países ISO-2 donde se busca con las frases de ese idioma. Un país pertenece a UN solo idioma.
#    Ningún país es «el favorito»: el orden y la selección de países de origen salen de `barrido_paises_origen`
#    (parametros_barrido.propuesta.yaml), no de este archivo.
#  - Cada forma lleva frase en TODOS los idiomas declarados: `principal` (consulta de la pasada 1) y `variantes`
#    (consultas de la pasada 2, que parten una búsqueda con demasiados anuncios en cortes distintos).
#  - Las búsquedas no se traducen solas: la Biblioteca busca texto literal, por eso cada idioma tiene sus giros naturales.
#  - Ninguna frase se repite dentro de un idioma (ni entre formas ni entre principal y variantes).
#  - El orden de las formas es el orden del plan. Agregar una forma NO cambia los qid de las demás.
# Las frases son búsquedas propias del sistema (confiables). Lo que devuelve la Biblioteca sigue siendo dato no confiable.

schema_version: "1.0.0"
version: 1

idiomas:
  es: {paises: [ES, MX, CO, AR, CL, PE]}
  en: {paises: [US, GB, CA, AU]}
  pt: {paises: [BR, PT]}
  it: {paises: [IT]}
  fr: {paises: [FR]}
  de: {paises: [DE, AT]}
  pl: {paises: [PL]}
  ro: {paises: [RO]}

