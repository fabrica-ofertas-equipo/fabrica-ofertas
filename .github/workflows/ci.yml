# CI de la fábrica de ofertas (docs/06 §4.6: "pruebas, gitleaks, sonda de hooks; nada que mueva
# dinero corre en Actions"). SIN secretos (ningún `secrets.*`) y SIN permisos de escritura
# (`permissions: contents: read` a nivel de workflow, nunca se sube a producción desde aquí).
# Todo corre en modo prueba: FABRICA_ENTORNO nunca se fija en produccion, ningún paso usa --live.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # [VERIFICAR] el repo fija Python 3.15 (docs/convenciones-de-codigo.md §1); actions/setup-python
          # no lo ofrecía al escribir esto. Actualizar en cuanto esté disponible como versión fijada.
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          # [VERIFICAR] el repo fija Node v26 (docs/convenciones-de-codigo.md §1); mismo caso que Python arriba.
          node-version: "22"

      - name: Instalar dependencias de Python (sin paquetes globales)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validar esquemas, ejemplos y ofertas/_ejemplo (scripts.validar_esquemas)
        run: python -m scripts.validar_esquemas

      - name: Pruebas (unittest, pytest si está, node --test por carpeta)
        run: bash scripts/test_all.sh

      - name: Lint de sintaxis (compileall, node --check)
        run: bash scripts/lint.sh

      - name: Lint estático (dinero fijo, datos personales, prefijos de credencial)
        run: python -m scripts.lint_estatico

      - name: Sonda de hooks del runner de agentes (100 % de los casos deben salir 2)
        run: python -m agentes.sonda_hooks

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Segunda defensa (la primera es scripts/lint_estatico.py, que SÍ corre siempre arriba).
    # gitleaks-action es gratuito para repos públicos; en un repo privado puede exigir
    # GITLEAKS_LICENSE (secreto) según su licencia [VERIFICAR en el momento de activarlo]. Por eso
    # este job NO bloquea el CI (continue-on-error) hasta que el dueño confirme la licencia; no usa
    # ningún `secrets.*` tal como está.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
