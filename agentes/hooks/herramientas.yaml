# agentes/hooks/herramientas.yaml - clasificación de herramientas para pretooluse_gasto.py (docs/09 §14.2).
# Ruta PROTEGIDA (igual que el resto de agentes/hooks/): el agente no la edita (deny en el piso).
# Regla de diseño fail-closed: una herramienta que no aparece en "lectura" ni en "neutra" es "escritura"
# (lo desconocido es escritura, §14.2). Los patrones usan comodines estilo fnmatch ("*", "?").
#
# "escritura" no necesita enumerar TODO lo que se deniega (eso ya lo hace el default): aquí se nombran
# las herramientas de mayor riesgo para que la sonda de hooks (agentes/sonda_hooks.py) las pruebe una
# por una, y como documentación para quien lea el archivo.

schema_version: "1.0.0"

lectura:
  - "Read"
  - "Grep"
  - "Glob"
  - "mcp__*__ads_get_*"
  - "mcp__*__ads_insights_*"
  - "mcp__*__ads_library_search"
  - "mcp__*__ads_account_get_activity_logs"
  - "mcp__*__ads_get_errors"
  - "mcp__*__get*"
  - "mcp__*__list*"
  - "mcp__*__balance"
  - "mcp__*__models_explore"
  - "mcp__*__ads_studio_quote"
  - "mcp__*__ads_studio_get_cost"

neutra:
  - "WebSearch"
  - "WebFetch"

# Documentadas a propósito (defensivo: ya caerían en "escritura" por el default); la sonda de hooks
# (m07) las nombra una por una.
escritura:
  - "mcp__*__ads_activate_entity"
  - "mcp__*__ads_update_entity"
  - "mcp__*__ads_boost_ig_post"
  - "mcp__*__ads_delete_*"
  - "mcp__*__ads_creative_*"
  - "mcp__*__ads_experiment_*"
  - "mcp__*__ads_update_custom_audience*"
  - "mcp__*__ads_pixel_*"
  - "mcp__*__ads_catalog_*"
  - "mcp__*__ads_finalize_local_ad_image_upload"
  - "mcp__*__ads_create_*"
  - "mcp__*__create-*"
  - "mcp__*__publish-*"
  - "mcp__*__publish_*"
  - "mcp__*__update-*"
  - "mcp__*__bulk-update-*"
  - "mcp__*__upload*"
  - "mcp__*__graphql_mutation"
  - "mcp__*__set-inventory"
  - "mcp__*__deploy_website"
  - "mcp__*__create_website"
  - "mcp__*__tiktok_*"
  - "mcp__*__delete_*"
  - "mcp__*__sandbox_exec"
  - "mcp__*__share_file"
  - "mcp__*__trash_file"
  - "mcp__*__create_file"
  - "mcp__*__update_file"
  - "mcp__*__generate_*"
  - "mcp__*__ads_studio_generate"
  - "mcp__*__ai_influencer_generate"
  - "mcp__*__execute_preset"
  - "Write"
  - "Edit"
  - "NotebookEdit"

# Herramientas de créditos (generación de piezas): exigen AGENT_COSTO_PREVIO y topes de
# limites.yaml (creditos_max_pieza, creditos_max_oferta). Subconjunto de "escritura".
creditos:
  - "mcp__*__generate_*"
  - "mcp__*__ads_studio_generate"
  - "mcp__*__ai_influencer_generate"
  - "mcp__*__execute_preset"

# Scripts Bash permitidos por nombre exacto y sus flags en lista blanca (pretooluse_bash.py, §14.5b).
# Cualquier flag fuera de esta lista, o cualquier script fuera de esta lista, se deniega.
#
# A8 (ola 2, B5b): las banderas de abajo son las del CLI REAL de cada script (comprobado contra
# meta/{crear,activar,pausar,subir_presupuesto}.py y meta/_cli_comun.agregar_argumentos_comunes).
# `--live` y `--object-ids` NUNCA existieron en estos 4 CLI (el modo se elige con `--modo
# {dry-run,fixture,live}`, convenciones §9); listarlos aquí era una lista blanca que no protegía
# nada real. Ningún agente (D7 Maker incluido) tiene hoy un `allow` que invoque estos 4 scripts
# (son código post-QA, no herramientas de un Maker: ver `agentes/plantillas_agentes/d7-maker.md`,
# «Prohibido»); esta lista es defensa en profundidad para si algún día se wire-ara mal.
# Lectura por bandera (SB-4): el valor de estas banderas puede ser EXACTAMENTE uno de estos archivos de empresa/ (solo
# lectura de parámetros/límites); cualquier otra ruta sigue sujeta a ofertas/<AGENT_OFERTA_ID>/ (pretooluse_bash.py).
rutas_lectura_por_bandera:
  "--parametros": ["empresa/parametros.yaml"]
  "--limites": ["empresa/limites.yaml"]

bash_scripts:
  "scripts/validar_esquemas.py":
    flags: ["esquemas", "ejemplos", "oferta", "limites", "parametros", "--limites", "--operacion"]
  "scripts/lint_claims.py":
    flags: ["--archivo", "--etapa", "--json", "--locale", "--macro-nicho", "--oferta", "--raiz", "--reglas"]
  "scripts/meta_crear.py":
    flags: ["--oferta", "--campana", "--creativos", "--ad-account", "--pixel-id", "--salida", "--modo",
            "--fixture", "--raiz", "--ahora", "--json"]
  "scripts/meta_activar.py":
    flags: ["--oferta", "--campana", "--ids-meta", "--hash-config", "--sello", "--cuenta", "--monto",
            "--moneda", "--creativos", "--modo", "--fixture", "--raiz", "--ahora", "--json"]
  "scripts/pausar.py":
    flags: ["--ad-account", "--campana-id", "--modo", "--fixture", "--raiz", "--ahora", "--json"]
  "scripts/subir_presupuesto.py":
    flags: ["--oferta", "--object-id", "--campo", "--monto", "--moneda", "--cuenta", "--modo",
            "--fixture", "--raiz", "--ahora", "--json"]
  # Skill D7 (ajena, solo lectura de código): scripts/d7.py reúne hechos y corre cálculos puros
  # (presupuesto, nombres, lint, preflight PX1-PX4) y SIEMPRE en fixture/dry-run; nunca llama a Meta.
  ".claude/skills/d7-campanas-meta/scripts/d7.py":
    flags: ["--entrada", "--salida", "--campana", "--archivo", "--esquema", "--dir", "--terminos",
            "--entradas", "--ahora", "--limites", "--parametros"]
  ".claude/skills/d7-campanas-meta/scripts/probar_evals.py":
