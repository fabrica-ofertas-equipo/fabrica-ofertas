# Aumento máximo de presupuesto por paso (referencia del backbone 5.6: 20 %). UNIDADES DE PORCENTAJE (20 = 20 %), no fracción; solo decision/entradas.py convierte. Nulo hasta que el dueño lo fije. [backbone 5.6; R02]
