  tipo_evidencia: E1-E4 de D1 §3.2
  color_automatizado: color de la nota 21 §9.4 para el acceso AUTOMATIZADO (V verde, A amarillo, R rojo); no es el color del acceso humano
  modo: qué se permite hoy (política_uso.modos)
  nivel_minimo: nivel de autonomía mínimo que la nota de origen daba a la fuente (N0 = dueño con Code)
  peso_inicial: confiabilidad como evidencia, 0-1, cadena decimal [HIPÓTESIS]; se recalibra con D8/X2
  peso_origen: nota que lo propuso o hipotesis_s_a
  retencion_dias: 'retención de la evidencia de la fuente (nota 21 §9.2): 90; 30 en YouTube; null en no_usar y en datos propios (retención propia de X1)'
