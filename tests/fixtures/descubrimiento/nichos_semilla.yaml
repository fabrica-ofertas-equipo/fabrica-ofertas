# empresa/descubrimiento/nichos.yaml (SEMILLA PROPUESTA por S-A, 2026-11-06). Propietario futuro: D1.
# Árbol macro_nicho -> nicho -> microsegmento (hoja). Generado a partir de nichos-hwr.yaml v2 + hojas de 24a/24b/20a/20b.
# No se aplica solo: la copia a empresa/descubrimiento/ la hace el dueño (o la sesión de D1). Ver docs/_historial/d1-v2-interfaces.md §2.
# v1.1 (2026-11-06, integrador): aplicadas C-17 y C-18 de docs/_historial/d1-v2-critica.md (formatos, nota D·S·P, «ola»→«tanda»); detalle en d1-v2-registro.md.
schema: nichos
version: 1
fecha: '2026-11-06'
estado: semilla_propuesta_s_a
propietario: D1 (propone cambios); el dueño aprueba; X2 propone ajustes de prior con n suficiente
fuentes_de_esta_semilla:
- docs/_historial/hwr-semillas/nichos-hwr.yaml v2 (86 hojas)
- docs/_investigacion/23, 24a, 24b, 20a, 20b
- docs/_investigacion/25 §1, §3.1
uso_del_prior: 'El prior y el rango son PRIORIDAD DE EXPLORACIÓN, nunca un veto ni un filtro por tema (decisión 13). El nivel real de un candidato
  lo calcula scripts/nivel_riesgo.py con los cuatro ejes P, C, E, N (nota 25 §2.3). Ninguna hoja está excluida: las de prior rojo se exploran
  solo vía reencuadre y con decisión del dueño (tanda 4).'
rango: 'niveles alcanzables conservando el deseo central según el encuadre (nota 25 §3.1). Distinto de candidatos.candidatos[].rango (entero de
  ranking): nombre canónico propuesto niveles_alcanzables al migrar (C-22).'
formatos: 'texto libre de exploración (lista de cadenas): NO es el enum de candidatos.entregable.formato, que fija el Maker; «hoja» suelta de la fuente se leyó [SUPUESTO] como «hoja de cálculo»'
tanda: 'antes «ola» (nota 25): prioridad de exploración 1-4; renombrada para no chocar con las olas de construcción (nota 25 §12.3 n.º 9). NO
  es un gate de lanzamiento: el orden lo fija el nivel del candidato.'
dsp: demanda·seguridad·producibilidad 0-5 de la nota 23 [HIPÓTESIS]; null = «n/s» (hoja nueva sin puntuar).
idiomas: subetiquetas de idioma (en, es, it, pl, ro, fr, de, pt); el locale concreto (es-AR, pt-BR…) lo decide M1.
confianza: 'C para todas: los puntajes y priors son hipótesis (nota 23 §0.1; nota 25 §12.2). Subir exige señales propias o evidencia E1 verificada.'
reencuadres_riesgo:
  RE-01: 'De la condición al método: el sujeto de la frase es el producto o el método, no el cuerpo ni la vida del lector'
  RE-02: 'De la cifra a la herramienta: cálculo, plantilla o tabla que el lector completa; las cifras son del entregable'
  RE-03: 'Del diagnóstico a la organización: registro, preparación de consulta, calendario'
  RE-04: De la promesa de ingresos a la plantilla de costos, precios y propuestas
  RE-05: De la cura al criterio de selección medible con fuente pública
  RE-06: Del control de un tercero a la preparación propia (ordenar ideas, ensayar, decidir)
  RE-07: Del plazo del efecto al plazo del formato (cuaderno de 21 días, no «supera en 21 días»)
  RE-08: De la segunda persona con atributo a la situación o el rol en tercera persona
  RE-09: 'De la prueba social inventada al producto: vista previa real y reseñas verificadas sin cifras'
  RE-10: 'Del servicio al archivo: sin humano, sin comunidad, sin enlace comisionado ni derivación'
  RE-11: Del dato sensible al evento y la URL genéricos; cuestionario de preferencias en lugar de puntaje clínico
  RE-12: 'De la recomendación personal al marco impersonal: glosario, tres tasas rotuladas, preguntas antes de decidir'
  RE-13: Del menor como destinatario al adulto responsable y arte propio sin imágenes de niños
  RE-14: De la urgencia y la garantía de resultado al precio único y el reembolso incondicional
  RE-15: De la vigilancia al acuerdo consentido
