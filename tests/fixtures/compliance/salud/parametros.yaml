# Copia (B6c, 2026-11-06) de tests/fixtures/engine/empresa_prueba/parametros.yaml (B1, solo lectura),
# sin cambios: los grupos compliance.* y salud_operativa.* ya coinciden con
# .claude/skills/x1-compliance/evals/salud/series.json (oráculo de regla_salud.py).
# PARÁMETROS de prueba del motor: copia de contratos/ejemplos/parametros.valido.yaml tomada el 2026-11-06 (el esquema exige todos los grupos).
# Las pruebas de compliance.salud NUNCA leen empresa/parametros.yaml real: leen esta copia.
# empresa/parametros.yaml - UMBRALES AJUSTABLES. Los propone el sistema, los aprueba el dueño (backbone 5.6).
# Esquema: contratos/parametros.schema.json. Cada parámetro: valor, unidad, hipotesis, fuente, ultima_calibracion, rango.
# Todos son [HIPÓTESIS] iniciales a calibrar (hipotesis: true). Sin float: decimales como cadena ("0.90"); dinero = entero en unidad menor + moneda.
# Cada clave tiene un único hogar (ver docs/contratos.md, Registro de reconciliación). Nunca se copia un número al código.

