      valor: 'Gana 500 € al mes en 7 días con tu currículum: guía con plantilla editable'
    l1_esperado:
    - lint_d3:L1-03
    - lint_d3:L1-13
    qa_esperado:
      veredicto: FAIL
      hallazgos:
      - check_id: L1-03
        severidad: BLOQUEANTE
        patron_clave: promesa-de-ingresos
      - check_id: L1-13
