# Defectos sembrados S1-S25 (departamentos/04-oferta.md, Anexo A.1) con su salida esperada del QA.
# Cada entrada describe mutaciones sobre una oferta dorada (evals/dorados/<base>/OF-*/) que scripts/aplicar_sembrado.py aplica a una COPIA.
# Cobertura: 3 macro-nichos (dinero, salud, relaciones) y 2+ idiomas (es-ES, it-IT, pl-PL). Severidad = la del Anexo A.1 (20 BLOQUEANTES: los 17 de siempre más S5, S17 y S21; 5 MAYORES: S2, S8, S9, S11 y S12; ningún MENOR).
#   l1_esperado: detecciones DETERMINISTAS que la skill ya tiene (lint_d3:L1-xx o validar:X.._..): scripts/test_scripts.py las comprueba.
#   qa_esperado: lo que debe devolver el QA (veredicto FAIL; hallazgos con check_id, severidad y patron_clave; ítems de la rúbrica que bajan).
#                Donde l1_esperado está vacío, solo el juicio del QA (L2/L3) puede detectarlo.
# Calibración: el QA debe detectar >= 90 % de los BLOQUEANTES (>= 18 de 20) y dar PASS a los dorados (backbone 6.6). Rotar el conjunto
# (otra base, otro texto) al cambiar la skill para que no se memorice. Los textos son [SUPUESTO]; ninguno se probó ante un revisor de Meta.
version: 0.1.1
sembrados:
  - id: S1
    severidad: BLOQUEANTE
    defecto: Promesa de ingresos con cifra y plazo («ganá USD 500 en 7 días»)
