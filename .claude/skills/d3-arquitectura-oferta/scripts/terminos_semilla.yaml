# Semilla LOCAL de términos para el lint estructural de D3 (scripts/lint_d3.py).
# [SUPUESTO] Hasta que X1 cargue empresa/compliance/terminos_sensibles/<locale>.yaml (propietario X1; hoy NO existe), D3 usa estas
# listas para detectar lo evidente en nombre, subtítulo y bonus. NO sustituyen el lint de X1 (compliance.lint_claims) ni su veto:
# solo cubren L1-12/L1-13 y avisan. Un acierto en el nombre DETIENE y decide una persona (L1-13 / X1-P07: el nombre es único por oferta
# y las listas dan falsos positivos, p. ej. «tabla estable»). Fuente de las listas por idioma: docs/_investigacion/25 §10.3 (X1-P07, X1-E01)
# y §5.1 («nunca decir»); los servicios prohibidos salen de departamentos/04-oferta.md §3.2 (bonus) y backbone 5.11 (EU sin servicio).
# Sin hechos externos nuevos: todo es [SUPUESTO] pendiente de revisión nativa por locale (backbone 5.10). Formato: cadenas = palabra o
# frase literal (insensible a mayúsculas, con límites de palabra); prefijo «re:» = expresión regular.
version: 0.1.0
fecha: "2026-11-06"

# Independiente del idioma (departamentos/04-oferta.md §3.2 y prompt de Fer: sufijos de marca que NO van en el nombre del producto).
sufijos_prohibidos_en_nombre: [Studio, Academy, Master, Pro, Lab, Creative]

# Marcas de terceros que no pueden estar en marca, título ni subtítulo (05-legal P-03; Venzio por decisión 6 del backbone).
marcas_terceros: [Venzio, CapCut, Premiere, Canva, Photoshop, ChatGPT, Notion]

por_idioma:
