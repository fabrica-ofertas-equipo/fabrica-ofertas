    nombre_verbos_de_cambio: [baja, alivia, calma, equilibra, reinicia, limpia, activa, elimina, libra, multiplica, cura, sana]
    nombre_estado_o_facilidad: [estable, cero, libre, total, reset, detox, boost, equilibrio, "sin experiencia", "sin inversión", "sin esfuerzo", garantizado, "ingresos pasivos", "libertad financiera"]
    nombre_ganar: ["re:\\bgan(a|á|ar|arás|ando|ancia|ancias)\\b", "re:\\bgana(r)? dinero\\b"]
    autopercepcion: [inútil, insuficiente, fracasada, fracasado, vergüenza]
    servicios_prohibidos: [comunidad, "grupo privado", soporte, mentoría, mentoria, "clases en vivo", "clase en vivo", "sesión en vivo", "sesion en vivo", "1:1", "uno a uno", coaching, "asesoría personal", "asesoria personal", certificado, suscripción, suscripcion, "actualizaciones de por vida"]
