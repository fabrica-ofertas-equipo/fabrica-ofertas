# PROPUESTA de parámetros de D2 (skill d2-validacion v0.1.0). NO está integrada en empresa/parametros.yaml.
# Mismo formato que empresa/parametros.yaml: se pega bajo `grupos.validacion` cuando el dueño apruebe los valores y se
# amplíe contratos/parametros.schema.json (rutas protegidas para agentes). Todas son [HIPÓTESIS]: ninguna está calibrada.
# Origen: departamentos/03-validacion.md §3.4 y Anexo A (las claves marcadas † allí), más las constantes que las fórmulas
# de §3.4 llevan escritas en el texto (3 anuncios leídos, 5 frases, 60 %, 0,6, 15 frases, …) y que aquí se vuelven clave
# para que NINGÚN umbral viva en el código de los scripts (regla del dueño: todo umbral es paramétrico).
# Las claves que YA existen en empresa/parametros.yaml (umbral_ss, n_ind_sost_go, is_go_max, is_nogo_min,
# umbral_hueco_ausencia, min_frases_voz, min_fuentes_voz, max_palabras_cita, relectura_dias, max_iteraciones_refinar,
# n_competidores_profundos, max_consultas_qa, muestreo_no_go_pct, sim_concepto; descubrimiento.anunciante_sostenido_dias_min y
# _conceptos_min; compliance.ngrama_alerta_temprana_palabras y ngrama_copia_palabras) NO se repiten: manda el valor aprobado.
# Si una clave falta en las dos fuentes, los scripts fallan cerrado (código 5). Sin float: decimales como cadena.

schema_version: "1.0.0"
version: 1
grupos:
  validacion:
    # --- Índice de sostén SS_a (spec §3.4): SS_a = ss_peso_s·min(S/tope,1) + ss_peso_c·min(C/tope,1) + ss_peso_i·I + ss_peso_p·min(P/ss_paises_tope,1) + ss_peso_e·E
    ss_peso_s: {valor: "0.30", unidad: peso, hipotesis: true, fuente: "D2 3.4 †", ultima_calibracion: null, rango: ["0.20", "0.40"]}
    ss_peso_c: {valor: "0.25", unidad: peso, hipotesis: true, fuente: "D2 3.4 †", ultima_calibracion: null, rango: ["0.15", "0.35"]}
    ss_peso_i: {valor: "0.20", unidad: peso, hipotesis: true, fuente: "D2 3.4 †", ultima_calibracion: null, rango: ["0.10", "0.30"]}
    ss_peso_p: {valor: "0.10", unidad: peso, hipotesis: true, fuente: "D2 3.4 †", ultima_calibracion: null, rango: ["0.00", "0.20"]}
    ss_peso_e: {valor: "0.15", unidad: peso, hipotesis: true, fuente: "D2 3.4 †", ultima_calibracion: null, rango: ["0.05", "0.25"]}
    ss_paises_tope: {valor: 2, unidad: paises, hipotesis: true, fuente: "D2 3.4 (el «2» de min(P_a/2,1))", ultima_calibracion: null, rango: [1, 3]}
    sep_iteracion_dias: {valor: 14, unidad: dias, hipotesis: true, fuente: "D2 Anexo A †", ultima_calibracion: null, rango: [7, 30]}
    ventana_entrantes_dias: {valor: 60, unidad: dias, hipotesis: true, fuente: "D2 Anexo A †", ultima_calibracion: null, rango: [30, 90]}
    marca_personal_peso: {valor: "0.6", unidad: peso, hipotesis: true, fuente: "D2 3.4 (marca_personal_escalera cuenta ×0,6)", ultima_calibracion: null, rango: ["0.4", "0.8"]}
    # --- Índice de saturación IS (spec §3.4): IS = 100·(is_peso_n·min(N/norm_N_ind,1) + is_peso_hhi·HHI + is_peso_entrantes·entrantes)
    is_peso_n: {valor: "0.40", unidad: peso, hipotesis: true, fuente: "D2 Anexo A †", ultima_calibracion: null, rango: ["0.30", "0.50"]}
    is_peso_hhi: {valor: "0.30", unidad: peso, hipotesis: true, fuente: "D2 Anexo A †", ultima_calibracion: null, rango: ["0.20", "0.40"]}
    is_peso_entrantes: {valor: "0.30", unidad: peso, hipotesis: true, fuente: "D2 Anexo A †", ultima_calibracion: null, rango: ["0.20", "0.40"]}
    norm_N_ind: {valor: 8, unidad: anunciantes, hipotesis: true, fuente: "D2 Anexo A †", ultima_calibracion: null, rango: [5, 12]}
    # --- Saturación de mecanismo y convergencia
    mecanismo_share_saturado: {valor: "0.5", unidad: fraccion, hipotesis: true, fuente: "D2 Anexo A †; 18d 5.3", ultima_calibracion: null, rango: ["0.4", "0.6"]}
    mecanismo_share_abierto: {valor: "0.15", unidad: fraccion, hipotesis: true, fuente: "D2 Anexo A †; 18d 5.4", ultima_calibracion: null, rango: ["0.1", "0.2"]}
    mecanismo_n_min_operadores: {valor: 4, unidad: operadores, hipotesis: true, fuente: "D2 Anexo A †; 18d 5.3", ultima_calibracion: null, rango: [3, 6]}
    umbral_solapamiento: {valor: "0.5", unidad: fraccion, hipotesis: true, fuente: "D2 Anexo A †", ultima_calibracion: null, rango: ["0.4", "0.6"]}
    convergencia_baja_max: {valor: "0.25", unidad: fraccion, hipotesis: true, fuente: "D2 3.4 (convergencia baja si el solapamiento es < 0,25)", ultima_calibracion: null, rango: ["0.15", "0.35"]}
    # --- Hueco sustentado (spec §3.4, GO): ausente en >= umbral_hueco_ausencia de los sostenidos con >= N anuncios leídos y con >= M frases de >= K fuentes
    hueco_min_anuncios_leidos: {valor: 3, unidad: anuncios, hipotesis: true, fuente: "D2 3.4 (GO, hueco sustentado)", ultima_calibracion: null, rango: [2, 5]}
    hueco_min_frases: {valor: 5, unidad: frases, hipotesis: true, fuente: "D2 3.2 (diferenciador) y 3.4 (hueco sustentado)", ultima_calibracion: null, rango: [3, 10]}
    hueco_min_fuentes: {valor: 3, unidad: fuentes, hipotesis: true, fuente: "D2 3.4 (hueco sustentado)", ultima_calibracion: null, rango: [2, 5]}
    hueco_localizacion_min_ref: {valor: 3, unidad: sostenidos, hipotesis: true, fuente: "D2 3.4 (hueco de localización: >= 3 sostenidos del mismo concepto en pais_referencia)", ultima_calibracion: null, rango: [2, 5]}
    # --- Voz del cliente
    min_frases_voz_propias: {valor: 10, unidad: frases, hipotesis: true, fuente: "D2 Anexo A †", ultima_calibracion: null, rango: [5, 20]}
    max_share_fuente_voz: {valor: "0.5", unidad: fraccion, hipotesis: true, fuente: "D2 Anexo A (ninguna fuente > 50 %)", ultima_calibracion: null, rango: ["0.4", "0.6"]}
    min_share_frases_locale: {valor: "0.5", unidad: fraccion, hipotesis: true, fuente: "D2 4 (paso 7: >= 50 % de frases del locale)", ultima_calibracion: null, rango: ["0.5", "0.8"]}
    # --- Confianza: puntos = confianza_puntos_por_criterio × criterios cumplidos (spec §3.4)
    confianza_puntos_por_criterio: {valor: 20, unidad: puntos, hipotesis: true, fuente: "D2 3.4", ultima_calibracion: null, rango: [20, 20]}
    confianza_pct_snapshots_min: {valor: "0.6", unidad: fraccion, hipotesis: true, fuente: "D2 3.4 criterio 1", ultima_calibracion: null, rango: ["0.5", "0.8"]}
    confianza_landings_min: {valor: 3, unidad: landings, hipotesis: true, fuente: "D2 3.4 criterio 2", ultima_calibracion: null, rango: [2, 5]}
    confianza_consultas_min: {valor: 8, unidad: consultas, hipotesis: true, fuente: "D2 3.4 criterio 3", ultima_calibracion: null, rango: [6, 12]}
    confianza_pct_transcripcion_min: {valor: "0.5", unidad: fraccion, hipotesis: true, fuente: "D2 3.4 criterio 4", ultima_calibracion: null, rango: ["0.3", "0.7"]}
    confianza_media_min_puntos: {valor: 40, unidad: puntos, hipotesis: true, fuente: "D2 3.4 (media 40-60)", ultima_calibracion: null, rango: [40, 60]}
    confianza_alta_min_puntos: {valor: 80, unidad: puntos, hipotesis: true, fuente: "D2 3.4 (alta >= 80)", ultima_calibracion: null, rango: [60, 100]}
    jaccard_replica_min: {valor: "0.5", unidad: fraccion, hipotesis: true, fuente: "D2 Anexo A †", ultima_calibracion: null, rango: ["0.4", "0.6"]}
    # --- Veredicto
    nogo_frases_min: {valor: 15, unidad: frases, hipotesis: true, fuente: "D2 3.4 (NO_GO: 0 sostenidos ∧ frases < 15 ∧ confianza >= media)", ultima_calibracion: null, rango: [10, 25]}
    # --- Plan de búsqueda y muestreo (SOP §4 pasos 1, 4 y 5)
    terminos_busqueda_min: {valor: 6, unidad: terminos, hipotesis: true, fuente: "D2 4 paso 1", ultima_calibracion: null, rango: [4, 8]}
    terminos_busqueda_max: {valor: 10, unidad: terminos, hipotesis: true, fuente: "D2 4 paso 1", ultima_calibracion: null, rango: [8, 14]}
    terminos_mejores_paises_secundarios: {valor: 4, unidad: terminos, hipotesis: true, fuente: "D2 4 paso 2 (si excede el presupuesto: los 4 mejores en los demás países)", ultima_calibracion: null, rango: [2, 6]}
    reuso_consultas_dias_max: {valor: 14, unidad: dias, hipotesis: true, fuente: "D2 4 paso 1", ultima_calibracion: null, rango: [7, 21]}
    competidores_deterministas_min: {valor: 5, unidad: page_ids, hipotesis: true, fuente: "D2 4 paso 4", ultima_calibracion: null, rango: [3, 8]}
    competidores_deterministas_max: {valor: 10, unidad: page_ids, hipotesis: true, fuente: "D2 4 paso 4", ultima_calibracion: null, rango: [6, 12]}
    competidores_al_azar: {valor: 2, unidad: page_ids, hipotesis: true, fuente: "D2 4 paso 4 (con semilla registrada)", ultima_calibracion: null, rango: [1, 4]}
    snapshots_por_competidor: {valor: 3, unidad: snapshots, hipotesis: true, fuente: "D2 Anexo A † (3 por defecto; 5 solo si el dueño amplía el tiempo a ≈ 25 min)", ultima_calibracion: null, rango: [3, 10]}
    urls_snapshot_max_modo_humano: {valor: 25, unidad: urls, hipotesis: true, fuente: "D2 4 paso 5", ultima_calibracion: null, rango: [15, 40]}
    # --- Reparto propuesto del tope max_consultas_biblioteca (el tope es del DUEÑO en limites.yaml; null hoy): 40 = 20 + 8 + 8 + 4 de reserva
    consultas_busqueda_max: {valor: 20, unidad: consultas, hipotesis: true, fuente: "D2 3.4 / 18d 4.4", ultima_calibracion: null, rango: [10, 40]}
    consultas_segunda_pasada_max: {valor: 8, unidad: consultas, hipotesis: true, fuente: "D2 3.4 / 18d 4.4", ultima_calibracion: null, rango: [4, 16]}
    consultas_relectura_max: {valor: 8, unidad: consultas, hipotesis: true, fuente: "D2 3.4 / 18d 4.4", ultima_calibracion: null, rango: [4, 16]}
    consultas_reserva: {valor: 4, unidad: consultas, hipotesis: true, fuente: "D2 3.4 / 18d 4.4", ultima_calibracion: null, rango: [2, 8]}
    # --- QA de D2 (spec §6). Las usa el QA y verificar_citas.py
    umbral_qa: {valor: "3.8", unidad: puntaje_0_5, hipotesis: true, fuente: "D2 6 (PASS: promedio >= 3,8); convención <grupo>.umbral_qa, LT-45", ultima_calibracion: null, rango: ["3.6", "4.2"]}
    qa_item_min: {valor: 3, unidad: puntaje_0_5, hipotesis: true, fuente: "D2 6 (ningún ítem <= 2)", ultima_calibracion: null, rango: [3, 3]}
    qa_acuerdo_ciego_mayor: {valor: "0.85", unidad: fraccion, hipotesis: true, fuente: "D2 6 D7 (acuerdo < 85 % = MAYOR)", ultima_calibracion: null, rango: ["0.75", "0.95"]}
    qa_acuerdo_ciego_bloqueante: {valor: "0.70", unidad: fraccion, hipotesis: true, fuente: "D2 6 D7 (acuerdo < 70 % = BLOQUEANTE)", ultima_calibracion: null, rango: ["0.6", "0.8"]}
    qa_clasificacion_ciega_n: {valor: 20, unidad: anunciantes, hipotesis: true, fuente: "D2 6 D7 (20 anunciantes, o todos si hay menos)", ultima_calibracion: null, rango: [10, 30]}
    qa_citas_verificadas_min: {valor: "0.95", unidad: fraccion, hipotesis: true, fuente: "D2 6 D5 (verificadas < 95 % falla)", ultima_calibracion: null, rango: ["0.9", "1.0"]}
    qa_citas_no_verificables_max: {valor: "0.05", unidad: fraccion, hipotesis: true, fuente: "D2 6 D5 (no verificables > 5 % falla)", ultima_calibracion: null, rango: ["0.0", "0.1"]}
    qa_replica_consultas_n: {valor: 3, unidad: consultas, hipotesis: true, fuente: "D2 3.5 (el QA repite 3 consultas)", ultima_calibracion: null, rango: [3, 5]}
    # --- Sonda de saturación y verificación del dueño (rutina D2 «sin la herramienta del video», SKILL.md §Rutina)
    sonda_monocultivo_share: {valor: "0.5", unidad: fraccion, hipotesis: true, fuente: "D2 3.4 (bandera monocultivo de la sonda); 18d 4.2", ultima_calibracion: null, rango: ["0.4", "0.7"]}
    competidores_verificables_min: {valor: 4, unidad: competidores, hipotesis: true, fuente: "docs/_historial/auditoria-pedidos-primera-sesion.md W8 (>= 4 competidores verificables)", ultima_calibracion: null, rango: [3, 6]}
    tiempo_verificacion_dueno_max_min: {valor: 15, unidad: minutos, hipotesis: true, fuente: "auditoría W8: el dueño verifica en <= 15 min", ultima_calibracion: null, rango: [10, 20]}
    minutos_por_enlace_verificacion: {valor: 1, unidad: minutos, hipotesis: true, fuente: "estimación: abrir un snapshot y comparar promesa y mecanismo", ultima_calibracion: null, rango: [1, 3]}
    tiempo_lectura_dueno_max_min: {valor: 30, unidad: minutos, hipotesis: true, fuente: "D2 3.5 (ciclo <= 30 min humanos)", ultima_calibracion: null, rango: [20, 45]}
    minutos_por_snapshot_lectura: {valor: 1, unidad: minutos, hipotesis: true, fuente: "estimación: leer un snapshot y anotar 5 campos en la hoja", ultima_calibracion: null, rango: [1, 2]}
    verificacion_enlaces_max_por_competidor: {valor: 3, unidad: enlaces, hipotesis: true, fuente: "rutina D2: el dueño verifica 2-3 enlaces por competidor", ultima_calibracion: null, rango: [2, 4]}
