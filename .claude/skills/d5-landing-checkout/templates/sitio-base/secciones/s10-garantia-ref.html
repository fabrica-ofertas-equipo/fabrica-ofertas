<section class="seccion tono-{{tono}}" id="{{ancla}}" aria-labelledby="titulo-garantia">
  <div class="contenedor contenedor--medio">
    <div class="garantia-caja tarjeta">
      <span class="escudo" aria-hidden="true"><svg class="ico"><use href="#i-escudo"></use></svg></span>
      <p><span class="chip chip--marca">{{dias}} {{t.dias}}</span></p>
      <h2 id="titulo-garantia">{{{titulo}}}</h2>
      <p>{{{texto}}}</p>
      <p class="nota">{{{nota_legal}}}</p>
    </div>
  </div>
</section>
