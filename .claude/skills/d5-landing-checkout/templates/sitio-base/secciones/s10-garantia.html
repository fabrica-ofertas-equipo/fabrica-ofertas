<section class="seccion tono-{{tono}}" id="{{ancla}}" aria-labelledby="titulo-garantia">
  <div class="contenedor contenedor--medio">
    <div class="garantia tarjeta">
      <div class="sello" aria-hidden="true">
        <svg class="ico sello__escudo"><use href="#i-escudo"></use></svg>
        <strong>{{dias}}</strong>
        <span>{{t.dias}}</span>
      </div>
      <div class="garantia__texto">
        <p class="kicker">{{t.con_garantia}}</p>
        <h2 id="titulo-garantia">{{{titulo}}}</h2>
        <p>{{{texto}}}</p>
        <p class="nota">{{{nota_legal}}}</p>
      </div>
    </div>
  </div>
</section>
