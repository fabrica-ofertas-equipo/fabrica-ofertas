<section class="seccion tono-{{tono}}" id="{{ancla}}" aria-labelledby="titulo-quien">
  <div class="contenedor">
    <header class="encabezado">
      <h2 id="titulo-quien">{{{titulo}}}</h2>
    </header>
    <div class="quien">
      <div class="tarjeta quien__col quien__col--si">
        <h3><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg><span>{{t.si}}</span></h3>
        <ul role="list">
{{#cada si}}
          <li><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg><span>{{{.}}}</span></li>
{{/cada}}
        </ul>
      </div>
      <div class="tarjeta quien__col quien__col--no">
        <h3><svg class="ico" aria-hidden="true"><use href="#i-x"></use></svg><span>{{t.no}}</span></h3>
        <ul role="list">
{{#cada no}}
          <li><svg class="ico" aria-hidden="true"><use href="#i-x"></use></svg><span>{{{.}}}</span></li>
{{/cada}}
        </ul>
      </div>
    </div>
  </div>
</section>
