# descender es automático ante violaciones. Valor inicial: N0 (manual guiado) en todas las etapas.
# OJO (CT-3 A-05, C-04): subir D7 o M1 a N3 NO levanta el gate H de accion:activar_campana ni de accion:lanzamiento_pais_idioma_nuevo aunque contratos/gates.json diga S en N3/N4:
# están en las seis acciones mínimas de limites.acciones_gate_humano (esquema + validador + engine.guard; no se quitan ni con firma). Gate efectivo = el más estricto de las cuatro fuentes;
# el validador avisa GATE_ACTIVAR_H. Que el botón active sin clic en N3/N4 es la decisión estructural D-02 del dueño [DUEÑO].

