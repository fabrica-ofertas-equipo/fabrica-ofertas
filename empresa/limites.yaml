# Sello del dueño: hash sha256 del JSON canónico de este contenido sin `sello` + `firma` Ed25519 (clave privada solo en el equipo del dueño; el motor tiene la pública) + `clave_id`.
# Lo calcula y escribe `python -m engine.limites sellar --como dueno` (único escritor, B1). El hash vigente también va a LIMITES_HASH_ANCLA (fuera del volumen).
# Coherencia exigida por evaluar_limites: gasto_diario_por_oferta <= gasto_diario_global; perdida_max <= gasto_total <= limite_gasto_cuenta_meta <= capital_en_riesgo_total;
# perdida_neta_acumulada_max <= capital; ofertas_simultaneas x gasto_diario_por_oferta <= gasto_diario_global; topes críticos >= 1 (cero = null o PAUSA);
# cuota_gasto_amarillo_b_max_pct <= cuota_gasto_amarillo_max_pct (1.3.0).
sello: null
