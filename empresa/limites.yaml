# empresa/limites.yaml - TECHOS DUROS. Solo el dueño escribe este archivo (deny + hash firmado).
# Esquema: contratos/limites.schema.json. Importes = enteros en la unidad menor (centavos) de `moneda_limites`.
# Regla de diseño (fail-closed): si una clave NECESARIA para una operación está en null (o la lista exigida está vacía) o falta el `sello`,
# ningún script gasta ni activa (código de salida 5). Funcion de comprobación: scripts/validar_esquemas.py::evaluar_limites.
# null = OBLIGATORIO DEL DUEÑO. Los valores no nulos son hechos de plataforma o el marco fijo (decisión 13).
# La pérdida máxima por oferta se define a partir de los presupuestos de testeo (decisión del dueño, 2026-11-06).

# 1.3.0 (CT-3, lote A): claves de la decisión 13 y de la nota 25 §10.1 (más abajo, antes de `sello`). Con schema_version >= 1.3.0 son OBLIGATORIAS (pueden ser null).
# null en `nivel_max_lanzable` o en las cuotas de amarillo = SOLO VERDE (fail-closed; no cuenta como "dato faltante" para evaluar_limites). Lo fija el dueño [DUEÑO].
schema_version: "1.3.0"
version: 1

# Moneda de TODOS los importes de este archivo (enteros en su unidad menor). Debe ser la moneda de la única cuenta publicitaria de Meta; otra moneda exige tipo de cambio registrado. [O0 3.1; reconciliación R01]
moneda_limites: null  # OBLIGATORIO DEL DUEÑO

